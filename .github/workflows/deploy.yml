name: Deploy & Validate Portfolio Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON Data & HTML
        run: |
          python -c "
          import json
          with open('data.json', 'r') as f:
              data = json.load(f)
          print(f'Validated data.json: {len(data.get(\"repos\", []))} repos, {len(data.get(\"articles\", []))} articles, {len(data.get(\"hf\", []))} HF assets.')
          "

      - name: Check HTML File Exists
        run: |
          test -f index.html
          echo "index.html validation passed!"
