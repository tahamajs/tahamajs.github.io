name: Auto-Sync Substack RSS Articles

on:
  schedule:
    - cron: '17 */6 * * *' # Offset minute to bypass GitHub Actions peak queue delays
  workflow_dispatch:

concurrency:
  group: sync-substack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-substack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Parse Substack RSS
        run: |
          python3 -c "
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re

          url = 'https://hooshaai.substack.com/feed'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'})
          
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  xml_bytes = resp.read()
              
              root = ET.fromstring(xml_bytes)
              channel = root.find('channel')
              items = channel.findall('item') if channel is not None else []
              
              articles = []
              for item in items:
                  title = item.findtext('title', '').strip()
                  link = item.findtext('link', '').strip()
                  pub_date = item.findtext('pubDate', '').strip()
                  desc = item.findtext('description', '').strip()
                  
                  clean_desc = re.sub(r'<[^>]+>', '', desc)
                  if len(clean_desc) > 150:
                      clean_desc = clean_desc[:147] + '...'
                      
                  articles.append({'title': title, 'link': link, 'date': pub_date[:16], 'desc': clean_desc})

              with open('data.json', 'r') as f:
                  data = json.load(f)

              data['articles'] = articles

              with open('data.json', 'w') as f:
                  json.dump(data, f, indent=2)

              print(f'Successfully synced {len(articles)} Substack articles into data.json!')
          except Exception as e:
              print(f'Error syncing Substack feed: {e}')
              raise e
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync latest Substack articles [skip ci]"
            git push
          else
            echo "No changes in data.json to commit."
          fi
