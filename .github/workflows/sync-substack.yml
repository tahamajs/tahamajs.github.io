name: Auto-Sync Substack RSS Articles

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:

jobs:
  sync-substack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & Parse Substack RSS
        run: |
          python -c "
          import urllib.request, re, json

          url = 'https://hooshaai.substack.com/feed'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              xml_str = resp.read().decode('utf-8')

          items = re.findall(r'<item>(.*?)</item>', xml_str, re.DOTALL)
          articles = []
          for item in items:
              title_m = re.search(r'<title><!\[CDATA\[(.*?)\]\]></title>', item) or re.search(r'<title>(.*?)</title>', item)
              link_m = re.search(r'<link>(.*?)</link>', item)
              pub_m = re.search(r'<pubDate>(.*?)</pubDate>', item)
              desc_m = re.search(r'<description><!\[CDATA\[(.*?)\]\]></description>', item) or re.search(r'<description>(.*?)</description>', item)
              
              title = title_m.group(1).strip() if title_m else ''
              link = link_m.group(1).strip() if link_m else ''
              date = pub_m.group(1).strip() if pub_m else ''
              desc = desc_m.group(1).strip() if desc_m else ''
              clean_desc = re.sub(r'<[^>]+>', '', desc)
              if len(clean_desc) > 150:
                  clean_desc = clean_desc[:147] + '...'
                  
              articles.append({'title': title, 'link': link, 'date': date[:16], 'desc': clean_desc})

          with open('data.json', 'r') as f:
              data = json.load(f)

          data['articles'] = articles

          with open('data.json', 'w') as f:
              json.dump(data, f, indent=2)

          print(f'Successfully synced {len(articles)} Substack articles into data.json!')
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff-index --quiet HEAD || git commit -m "Auto-sync latest Substack articles [skip ci]" && git push
