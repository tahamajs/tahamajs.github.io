name: Auto-Sync Substack RSS Articles

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-substack
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-substack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch & Parse Substack RSS
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          import sys
          from datetime import datetime
          from email.utils import parsedate_to_datetime

          url = 'https://hooshaai.substack.com/feed'

          headers = {
              'User-Agent': (
                  'Mozilla/5.0 (Windows NT 10.0; Win64; x64) '
                  'AppleWebKit/537.36 (KHTML, like Gecko) '
                  'Chrome/122.0.0.0 Safari/537.36'
              ),
              'Accept': 'application/rss+xml, application/xml, text/xml, */*;q=0.1',
              'Accept-Language': 'en-US,en;q=0.9',
              'Referer': 'https://hooshaai.substack.com/',
              'Cache-Control': 'no-cache',
          }

          req = urllib.request.Request(url, headers=headers)

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  xml_bytes = resp.read()
          except Exception as e:
              print(f'Error syncing Substack feed: {e}', file=sys.stderr)
              sys.exit(1)

          root = ET.fromstring(xml_bytes)
          channel = root.find('channel')
          items = channel.findall('item') if channel is not None else []

          def to_iso(date_str: str) -> str:
              # pubDate: "Mon, 06 Oct 2025 12:34:56 GMT"
              try:
                  dt = parsedate_to_datetime(date_str)
                  return dt.strftime('%Y-%m-%d')
              except Exception:
                  # fallback: try common patterns, else return first 10 chars
                  for fmt in ('%Y-%m-%dT%H:%M:%S', '%Y-%m-%d %H:%M:%S', '%Y-%m-%d'):
                      try:
                          return datetime.strptime(date_str[:19], fmt).strftime('%Y-%m-%d')
                      except Exception:
                          continue
                  return (date_str or '')[:10]

          articles = []
          for item in items:
              title = (item.findtext('title') or '').strip()
              link = (item.findtext('link') or '').strip()
              pub_date = (item.findtext('pubDate') or '').strip()
              desc = (item.findtext('description') or '').strip()

              clean_desc = re.sub(r'<[^>]+>', '', desc)
              clean_desc = re.sub(r'\s+', ' ', clean_desc).strip()
              if len(clean_desc) > 200:
                  clean_desc = clean_desc[:197] + '...'

              articles.append({
                  'title': title,
                  'link': link,
                  'date': to_iso(pub_date),
                  'desc': clean_desc,
              })

          with open('data.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          data['articles'] = articles

          with open('data.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          print(f'Successfully synced {len(articles)} Substack articles into data.json!')
          PY

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync latest Substack articles [skip ci]"
            git push
          else
            echo "No changes in data.json to commit."
          fi
